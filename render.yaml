services:
  - type: web
    name: lunar-almanac-2027
    runtime: node
    plan: starter
    buildCommand: node --check tools/serve.mjs
    startCommand: node tools/serve.mjs --no-open
    healthCheckPath: /api/health
    disk:
      name: lunar-almanac-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: APP_PASSWORD
        sync: false
      - key: APP_SESSION_SECRET
        generateValue: true
      - key: TIMETREE_EMAIL
        sync: false
      - key: TIMETREE_PASSWORD
        sync: false
      - key: TIMETREE_CALENDAR_ID
        sync: false
